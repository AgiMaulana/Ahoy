# git-cliff configuration for Ahoy releases, used by
# .github/workflows/release.yml to generate release notes.
#
# Unlike git-cliff's built-in default, commits that do not follow the
# Conventional Commits format are kept (filter_unconventional = false) and
# grouped under "Other Changes", so a plain "Add ..." subject is never
# silently dropped from a release.

[changelog]
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\n
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
fail_on_unmatched_commit = false
sort_commits = "oldest"
# Keep the subject line only: drops commit bodies and trailers such as
# Co-authored-by/Signed-off-by from the rendered changelog.
commit_preprocessors = [
  { pattern = '(?s)\r?\n.*$', replace = '' },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
  { message = ".*", group = "Other Changes" },
]
